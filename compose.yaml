services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: o2_monitor
      POSTGRES_USER: o2_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - o2-postgres-data:/var/lib/postgresql/data

volumes:
  o2-postgres-data:
